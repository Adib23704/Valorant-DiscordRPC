[package]
name = "valo-discord-rpc"
version = "0.1.0"
description = "A modern Discord Rich Presence client for Valorant"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/krvntzkl/valorant-rpc"

[lib]
name = "valo_discord_rpc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"

# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# HTTP client (with rustls for self-signed cert handling)
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Process detection
sysinfo = "0.32"

# Discord Rich Presence
discord-rich-presence = "0.2"

# Error handling
thiserror = "2"
anyhow = "1"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Base64 encoding for auth
base64 = "0.22"

# Async utilities
futures = "0.3"
parking_lot = "0.12"
tauri-plugin-mcp-bridge = "0.8.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

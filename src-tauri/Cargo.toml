[package]
name = "valorant-discordrpc"
version = "1.0.0"
description = "A modern Discord Rich Presence client for Valorant that displays your in-game status on Discord."
authors = ["Adib23704 <adib23704@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Adib23704/VALORANT-DiscordRPC"

[lib]
name = "valorant_discordrpc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"



tokio = { version = "1.49.0", features = ["full", "sync"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
sysinfo = "0.38.2"
discord-rich-presence = "1.1.0"
thiserror = "2.0.18"
anyhow = "1.0.101"
chrono = { version = "0.4.43", features = ["serde"] }
tracing = "0.1.44"
base64 = "0.22.1"
futures = "0.3.32"
parking_lot = "0.12.5"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
